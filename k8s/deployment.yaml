apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerodha-landing-deployment
  labels:
    app: zerodha-landing-page
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zerodha-landing-page
  template:
    metadata:
      labels:
        app: zerodha-landing-page
    spec:
      containers:
        - name: landing-page-container
          image: neerajpadghan/zerodha-landing-page:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
