apiVersion: apps/v1
kind: Deployment

metadata:
  name: nexafolio-deployment
  labels:
    app: nexafolio-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nexafolio-platform

  template:
    metadata:
      labels:
        app: nexafolio-platform

    spec:
      containers:
      - name: nexafolio-container

        image: 012994659515.dkr.ecr.us-east-1.amazonaws.com/nexafolio-platform:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 80

        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"


          limits:
            memory: "128Mi"
            cpu: "200m"

        livenessProbe:
          httpGet:
            path: /health
            port: 80

          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 80

          initialDelaySeconds: 5
          periodSeconds: 5